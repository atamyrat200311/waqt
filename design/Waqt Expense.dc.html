<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes wqBlink{0%,49%{opacity:1}50%,100%{opacity:0}}</style></helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink)">
<div style="position:absolute;inset:0;pointer-events:none"><dc-import name="Waqt Home" hint-size="390px,844px"></dc-import></div>
<div onClick="{{ close }}" style="position:absolute;inset:0;background:var(--dim)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;top:118px;background:var(--card);border-radius:28px 28px 0 0;padding:8px 16px 28px;box-shadow:0 -12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column">
<div style="width:36px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 8px;flex:none"></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:44px;flex:none">
<div onClick="{{ close }}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></div>
<span style="font-size:17px;font-weight:600">Add expense</span>
<div style="height:32px;padding:0 12px;border-radius:999px;background:var(--fill);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600">Today<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0">
<div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:var(--serif);font-size:80px;line-height:1;letter-spacing:-.04em;font-weight:350;font-variation-settings:'opsz' 144">{{ shown }}</span><span style="display:block;width:2px;height:58px;background:var(--acc);align-self:center;animation:wqBlink 1s infinite"></span><span style="font-size:18px;font-weight:600;color:var(--mu)">TMT</span></div>
<div style="font-size:14px;color:var(--mu);margin-top:10px">Add a note</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0 16px;flex:none">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6"><div onClick="{{ c.pick }}" style="{{ c.s }}"><sc-if value="{{ c.heart }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" style="{{ c.hs }}"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>{{ c.n }}</div></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="12"><div onClick="{{ k.press }}" style="height:56px;border-radius:18px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px;cursor:pointer;user-select:none;transition:transform .08s,background .08s" style-active="transform:scale(.94);background:var(--ln)"><sc-if value="{{ k.back }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"></path><path d="m16 9-5 6M11 9l5 6"></path></svg></sc-if>{{ k.l }}</div></sc-for>
</div>
<div onClick="{{ save }}" style="{{ saveS }}">{{ saveLabel }}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;onSave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(amount:number,cat:string)=&gt;void&quot;},&quot;nav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(s:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { amt: '45', cat: 'Groceries', saved: false };
  press(k) {
    let a = this.state.amt;
    if (k === 'back') a = a.length > 1 ? a.slice(0, -1) : '0';
    else if (k === '.') { if (!a.includes('.')) a += '.'; }
    else if (a === '0') a = k;
    else if (a.length < 7 && !(a.includes('.') && a.split('.')[1].length >= 2)) a += k;
    this.setState({ amt: a, saved: false });
  }
  renderVals() {
    const st = this.state, P = this.props;
    const [i, d] = st.amt.split('.');
    const shown = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F') + (d !== undefined ? '.' + d : '');
    const val = parseFloat(st.amt) || 0;
    const cats = ['Groceries', 'Transport', 'Food', 'Bills', 'Sadaqa', 'Other'].map(n => {
      const on = st.cat === n, sq = n === 'Sadaqa';
      return { n, heart: sq, pick: () => this.setState({ cat: n }),
        hs: { fill: on ? 'currentColor' : 'var(--br)', stroke: on ? 'currentColor' : 'var(--br)' },
        s: { height: 40, padding: '0 15px', borderRadius: 999, display: 'flex', alignItems: 'center', gap: 6, fontSize: 14, fontWeight: 600, cursor: 'pointer', boxSizing: 'border-box', transition: 'background .15s',
          background: on ? (sq ? 'var(--bri)' : 'var(--pri)') : (sq ? 'var(--brs)' : 'var(--card)'), color: on ? (sq ? 'var(--onbr)' : 'var(--onp)') : (sq ? 'var(--bri)' : 'var(--ink)'), border: on || sq ? '1px solid transparent' : '1px solid var(--ln)' } };
    });
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'].map(k => ({ l: k === 'back' ? '' : k, back: k === 'back', press: () => this.press(k) }));
    const sq = st.cat === 'Sadaqa';
    return { shown, cats, keys,
      saveLabel: st.saved ? 'Saved' : val ? `Save ${shown} TMT` + (sq ? ' as sadaqa' : '') : 'Enter an amount',
      saveS: { height: 56, marginTop: 12, borderRadius: 18, flex: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 600, cursor: val ? 'pointer' : 'default', background: val ? 'var(--pri)' : 'var(--fill)', color: val ? 'var(--onp)' : 'var(--mu)', transition: 'background .2s' },
      save: () => { if (!val) return; if (P.onSave) P.onSave(val, st.cat); else this.setState({ saved: true }); },
      close: () => P.nav && P.nav('home') };
  }
}
</script>
</body>
</html>
