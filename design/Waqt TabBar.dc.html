<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:390px;height:84px;box-sizing:border-box;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 36px 0">
<div onClick="{{ goT }}" style="{{ sT }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M4.9 7.9 7 10M19.1 7.9 17 10M2 18h20M7 18a5 5 0 0 1 10 0"></path></svg><span>Today</span></div>
<div onClick="{{ goTo }}" style="{{ sTo }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect></svg><span>Tools</span></div>
<div onClick="{{ goM }}" style="{{ sM }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Me</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;tools&quot;,&quot;me&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(screen:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today', n = this.props.nav;
    const s = k => ({ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, width: 72, minHeight: 48, cursor: 'pointer', fontSize: 11, fontWeight: a === k ? 700 : 500, color: a === k ? 'var(--acc)' : 'var(--mu)', letterSpacing: '.01em' });
    const g = k => () => n && n(k);
    return { sT: s('today'), sTo: s('tools'), sM: s('me'), goT: g('home'), goTo: g('tools'), goM: g('me') };
  }
}
</script>
</body>
</html>
