<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em;box-sizing:border-box">
<span>{{ time }}</span>
<span style="display:flex;align-items:center;gap:7px">
<span style="display:flex;align-items:flex-end;gap:2px;height:11px"><span style="display:block;width:3px;height:4px;border-radius:1px;background:currentColor"></span><span style="display:block;width:3px;height:6px;border-radius:1px;background:currentColor"></span><span style="display:block;width:3px;height:8px;border-radius:1px;background:currentColor"></span><span style="display:block;width:3px;height:11px;border-radius:1px;background:currentColor"></span></span>
<span style="display:block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;box-sizing:border-box;opacity:.85"><span style="display:block;width:75%;height:100%;background:currentColor;border-radius:1px"></span></span>
</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:50},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14:45&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
