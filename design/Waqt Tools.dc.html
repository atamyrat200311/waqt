<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes wqSway{0%,100%{transform:rotate(30deg)}50%{transform:rotate(38deg)}}@keyframes wqRipple{from{transform:scale(.85);opacity:.5}to{transform:scale(1.25);opacity:0}}</style></helmet>
<div style="width:390px;height:844px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column">
<dc-import name="Waqt Status" time="14:46" hint-size="390px,50px"></dc-import>
<div style="flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:104px">
<div style="padding:48px 20px 16px;font-family:var(--serif);font-size:34px;letter-spacing:-.015em">Tools</div>
<div style="margin:0 16px;padding:20px;border-radius:var(--r,28px);background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;gap:16px">
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)">Qibla</div>
<div style="font-family:var(--serif);font-size:48px;line-height:1;letter-spacing:-.03em;margin-top:8px">234°</div>
<div style="font-size:14px;color:var(--mu);margin-top:8px;line-height:1.4;text-wrap:pretty">Turn until the arrow points up</div>
</div>
<div style="position:relative;width:148px;height:148px;flex:none">
<div style="position:absolute;inset:0;border-radius:50%;border:1px solid var(--ln);background:var(--bg)"></div>
<sc-for list="{{ ticks }}" as="t" hint-placeholder-count="0"><span style="{{ t }}"></span></sc-for>
<span style="{{ nPos }}">N</span>
<span style="position:absolute;left:72px;top:-6px;width:4px;height:12px;border-radius:2px;background:var(--ink)"></span>
<div style="position:absolute;inset:0;animation:wqSway 5s ease-in-out infinite">
<span style="position:absolute;left:73px;top:26px;width:2px;height:48px;background:var(--br);border-radius:1px"></span>
<span style="position:absolute;left:68px;top:16px;width:12px;height:12px;background:var(--ink);border-radius:2px;box-shadow:inset 0 3px 0 var(--br)"></span>
</div>
<span style="position:absolute;left:68px;top:68px;width:12px;height:12px;border-radius:50%;background:var(--br);box-shadow:0 0 0 4px var(--brs)"></span>
</div>
</div>
<div style="margin:12px 16px 0;padding:20px;border-radius:var(--r,28px);background:var(--hero);color:var(--hink)">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><div style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hmu)">Tasbih</div><div style="font-size:16px;font-weight:600;margin-top:4px">{{ phrase }}</div></div>
<div onClick="{{ reset }}" style="height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Reset</div>
</div>
<div style="display:flex;justify-content:center;padding:18px 0 6px">
<div onClick="{{ tap }}" style="position:relative;width:176px;height:176px;border-radius:50%;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);transition:transform .09s" style-active="transform:scale(.94)">
<svg width="176" height="176" viewBox="0 0 176 176" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="88" cy="88" r="82" fill="none" stroke-width="4" stroke="rgba(255,255,255,.12)"></circle><circle cx="88" cy="88" r="82" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="515.2" style="{{ ringS }}"></circle></svg>
<span key="{{ n }}" style="position:absolute;inset:4px;border-radius:50%;border:2px solid var(--br);animation:wqRipple .5s ease-out forwards;opacity:0"></span>
<div style="display:flex;flex-direction:column;align-items:center"><span dir="rtl" lang="ar" style="font-family:var(--ar);font-size:20px;color:var(--hmu);line-height:1.2">{{ arabic }}</span><span style="font-family:var(--serif);font-size:58px;line-height:1;letter-spacing:-.03em;margin-top:2px">{{ n }}</span><span style="font-size:13px;color:var(--hmu);margin-top:4px">{{ sub }}</span></div>
</div>
</div>
<div style="display:flex;justify-content:center;gap:6px;padding-top:8px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><span style="{{ d }}"></span></sc-for></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 16px 0">
<div onClick="{{ goAdhkar }}" style="padding:14px;border-radius:var(--r,22px);background:var(--card);border:1px solid var(--ln);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;box-sizing:border-box"><span style="width:40px;height:40px;border-radius:13px;background:var(--mint);color:var(--mink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg></span><div style="margin-top:auto"><div style="font-size:14px;font-weight:600">Adhkar</div><div style="font-size:12px;color:var(--mu);margin-top:2px">Evening due</div></div></div>
<div onClick="{{ goCal }}" style="padding:14px;border-radius:var(--r,22px);background:var(--card);border:1px solid var(--ln);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;box-sizing:border-box"><span style="width:40px;height:40px;border-radius:13px;background:var(--mint);color:var(--mink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span><div style="margin-top:auto"><div style="font-size:14px;font-weight:600">Hijri calendar</div><div style="font-size:12px;color:var(--mu);margin-top:2px">22 Rabīʿ II</div></div></div>
<div onClick="{{ goRam }}" style="padding:14px;border-radius:var(--r,22px);background:var(--card);border:1px solid var(--ln);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;box-sizing:border-box"><span style="width:40px;height:40px;border-radius:13px;background:var(--brs);color:var(--bri);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></span><div style="margin-top:auto"><div style="font-size:14px;font-weight:600">Ramadan</div><div style="font-size:12px;color:var(--mu);margin-top:2px">in 127 days</div></div></div>
</div>
</div>
<dc-import name="Waqt TabBar" active="tools" nav="{{ nav }}" hint-size="390px,84px" style="position:absolute;left:0;bottom:0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;nav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(s:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { phase: 0, n: 21, complete: false };
  renderVals() {
    const st = this.state, P = this.props;
    const PH = [['SubḥānAllāh', 'سُبْحَانَ اللَّهِ', 33], ['Alḥamdulillāh', 'الْحَمْدُ لِلَّهِ', 33], ['Allāhu akbar', 'اللَّهُ أَكْبَرُ', 34]];
    const [ph, ar, target] = PH[st.phase];
    const heading = 200, R = 74;
    const ticks = Array.from({ length: 60 }, (_, i) => { const major = i % 15 === 0; return { position: 'absolute', left: 73.25, top: 4, width: 1.5, height: major ? 9 : 5, borderRadius: 1, background: major ? 'var(--ink)' : 'var(--mu)', opacity: major ? .9 : .45, transformOrigin: '0.75px 70px', transform: `rotate(${i * 6 - heading}deg)` }; });
    const a = -heading * Math.PI / 180, nr = 52;
    const nav = k => () => P.nav && P.nav(k);
    return {
      ticks, nPos: { position: 'absolute', left: R + nr * Math.sin(a) - 6, top: R - nr * Math.cos(a) - 8, width: 12, textAlign: 'center', fontSize: 12, fontWeight: 700, color: 'var(--bri)' },
      phrase: st.complete ? 'Complete · 100' : ph, arabic: ar, n: st.n, sub: st.complete ? 'Tap to start again' : 'of ' + target,
      ringS: { stroke: 'var(--br)', strokeDashoffset: 515.2 * (1 - (st.complete ? 1 : st.n / target)), transition: 'stroke-dashoffset .2s ease-out' },
      dots: PH.map((_, i) => ({ display: 'block', width: i === st.phase ? 18 : 6, height: 6, borderRadius: 3, background: i < st.phase || st.complete ? 'var(--br)' : i === st.phase ? 'var(--hink)' : 'rgba(255,255,255,.25)', transition: 'width .3s' })),
      tap: () => {
        if (st.complete) return this.setState({ phase: 0, n: 0, complete: false });
        const n = st.n + 1;
        if (n >= target) { if (st.phase < 2) setTimeout(() => this.setState({ phase: st.phase + 1, n: 0 }), 350); else return this.setState({ n, complete: true }); }
        this.setState({ n });
      },
      reset: () => this.setState({ phase: 0, n: 0, complete: false }),
      goAdhkar: nav('adhkar'), goCal: nav('calendar'), goRam: nav('ramadan'), nav: P.nav
    };
  }
}
</script>
</body>
</html>
